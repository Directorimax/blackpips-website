<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #0b0b12; color: #f7f3e8; font-family: Arial, sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 560px;
              background: #15151e;
              border: 1px solid #34303f;
              border-radius: 20px;
            "
          >
            <tr>
              <td style="padding: 32px">
                <p
                  style="margin: 0 0 12px; color: #d9ae54; font-weight: 700; letter-spacing: 0.08em"
                >
                  BLACKPIPS
                </p>
                <h1 style="margin: 0 0 16px; font-size: 26px; line-height: 1.25">
                  Verify your BLACKPIPS account
                </h1>
                <p style="margin: 0 0 24px; color: #c9c5d0; line-height: 1.6">
                  Confirm your email address to finish creating your account.
                </p>
                <a
                  href="https://www.blackpips.com/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
                  style="
                    display: inline-block;
                    border-radius: 999px;
                    background: #d9ae54;
                    color: #15120b;
                    padding: 13px 22px;
                    text-decoration: none;
                    font-weight: 700;
                  "
                  >Verify Email</a
                >
                <p style="margin: 24px 0 0; color: #8f8a98; font-size: 13px; line-height: 1.5">
                  If you did not create a BLACKPIPS account, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
